<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hadi & Ghia Engagement Invitation</title>
  <style>

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.72), transparent 44%),
        linear-gradient(135deg, #eee4d7, #d8c5ad);
      color: #9a761b;
      touch-action: manipulation;
    }

    .scene {
      --env-h: clamp(220px, 34vh, 300px);
      --env-w: min(90vw, 470px);
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      position: relative;
      display: grid;
      place-items: center;
      perspective: 1400px;
      overflow: hidden;
    }

    .hint {
      position: absolute;
      top: calc(50% - var(--env-h) / 2 - 54px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(78, 48, 17, 0.12);
      letter-spacing: 0.14em;
      font-size: 12px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity .45s ease, transform .45s ease;
    }

    .scene.open .hint {
      opacity: 0;
      transform: translateX(-50%) translateY(-16px);
      pointer-events: none;
    }

    .invitation {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 375px);
      aspect-ratio: 1055 / 1491;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 28px 65px rgba(58, 35, 12, 0.26);
      transform: translate(-50%, calc(-50% + 44px)) scale(.88) rotateX(2deg);
      transition:
        transform 2.25s cubic-bezier(.16, 1, .3, 1) .45s,
        opacity .55s ease .45s,
        filter 1.2s ease .45s,
        z-index 0s linear 1s;
      z-index: 4;
      opacity: 0;
      filter: brightness(.96);
      pointer-events: none;
    }

    .scene.open .invitation {
      transform: translate(-50%, calc(-50% - 108px)) scale(.96) rotateX(0deg);
      opacity: 1;
      filter: brightness(1);
      z-index: 32;
      transition:
        transform 2.25s cubic-bezier(.16, 1, .3, 1) .55s,
        opacity .55s ease .55s,
        filter 1.2s ease .55s,
        z-index 0s linear .95s;
    }

    .invitation img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .envelope {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--env-w);
      height: var(--env-h);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      transition: transform 1.35s ease;
      z-index: 20;
    }

    .scene.open .envelope {
      transform: translate(-50%, calc(-50% + 96px)) scale(.98);
    }

    .env-back {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, #f6eadb 0%, #dcc7ad 100%);
      box-shadow: 0 28px 70px rgba(68, 43, 18, 0.28);
      overflow: hidden;
    }

    .env-back::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, transparent 49.5%, rgba(156, 119, 55, .22) 50%, transparent 50.5%),
        linear-gradient(45deg, transparent 49.5%, rgba(156, 119, 55, .18) 50%, transparent 50.5%);
      opacity: .85;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 62%;
      background: linear-gradient(180deg, #f8eddf, #dfc9af);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 1.65s cubic-bezier(.16, 1, .3, 1), filter 1s ease;
      z-index: 12;
      filter: drop-shadow(0 10px 12px rgba(70, 45, 20, .12));
    }

    .scene.open .flap {
      transform: rotateX(178deg);
      filter: drop-shadow(0 -8px 10px rgba(70, 45, 20, .10));
    }

    .front-left, .front-right, .front-bottom {
      position: absolute;
      bottom: 0;
      background: linear-gradient(180deg, #f4e6d5, #d5bea1);
      z-index: 15;
    }

    .front-left {
      left: 0;
      width: 50%;
      height: 100%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    .front-right {
      right: 0;
      width: 50%;
      height: 100%;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
    }

    .front-bottom {
      left: 0;
      width: 100%;
      height: 56%;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      background: linear-gradient(180deg, #ead8c1, #cdb18e);
    }

    .wax {
      position: absolute;
      bottom: calc(var(--env-h) * .38);
      left: 50%;
      transform: translateX(-50%);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #f5d588, #b3862f 65%, #8a651f);
      z-index: 30;
      box-shadow: inset 0 2px 6px rgba(255,255,255,.35), 0 10px 20px rgba(70,45,20,.18);
      display: grid;
      place-items: center;
      color: #fff6dc;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: .08em;
      text-shadow: 0 1px 2px rgba(88, 48, 12, .16);
      line-height: 1;
      transition: transform .9s ease, opacity .55s ease;
    }

    .scene.open .wax {
      transform: translateX(-50%) scale(.85);
      opacity: .88;
    }

    .shadow {
      position: absolute;
      left: 50%;
      top: calc(50% + var(--env-h) / 2 + 24px);
      transform: translateX(-50%);
      width: min(88vw, 450px);
      height: 34px;
      border-radius: 50%;
      background: rgba(65, 42, 18, .20);
      filter: blur(14px);
      z-index: 1;
      transition: transform .8s ease, opacity .8s ease;
    }

    .scene.open .shadow {
      transform: translateX(-50%) translateY(80px) scale(.82);
      opacity: .62;
    }

    .open-again {
      position: absolute;
      bottom: max(14px, env(safe-area-inset-bottom));
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      background: rgba(255,255,255,.72);
      color: #9a761b;
      font-family: inherit;
      letter-spacing: .08em;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(78, 48, 17, 0.12);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .45s ease, transform .45s ease;
      z-index: 60;
    }

    .scene.open .open-again {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 520px) {
      .scene { --env-h: clamp(210px, 30vh, 250px); --env-w: 92vw; }
      .invitation { width: min(78vw, 330px); transform: translate(-50%, calc(-50% + 38px)) scale(.88) rotateX(2deg); }
      .scene.open .invitation { transform: translate(-50%, calc(-50% - 102px)) scale(.97) rotateX(0deg); }
      .scene.open .envelope { transform: translate(-50%, calc(-50% + 86px)) scale(.98); }
    }

  </style>
</head>
